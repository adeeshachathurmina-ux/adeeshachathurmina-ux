<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="100%" height="100%">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.8; r: 4.5; }
      50% { opacity: 0.4; r: 3.5; }
    }
    .term-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 13px; fill: #94a3b8; font-weight: 500; }
    .term-code { font-family: "Fira Code", "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 13.5px; }
    .prompt { fill: #38bdf8; font-weight: 700; }
    .cmd { fill: #f8fafc; font-weight: 600; }
    .log-ok { fill: #34d399; font-weight: 600; }
    .log-txt { fill: #94a3b8; }
    .json-key { fill: #818cf8; font-weight: 600; }
    .json-str { fill: #38bdf8; }
    .json-arr { fill: #f472b6; }
    .cursor { fill: #38bdf8; animation: blink 1s infinite; }
    .status-dot { fill: #34d399; animation: pulse 2s infinite; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="816" height="416" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8"/>

  <!-- Window Header Bar -->
  <path d="M 2 16 Q 2 2 16 2 L 804 2 Q 818 2 818 16 L 818 42 L 2 42 Z" fill="#1e293b" fill-opacity="0.6"/>
  <line x1="2" y1="42" x2="818" y2="42" stroke="#334155" stroke-width="1"/>

  <!-- macOS Window Control Buttons -->
  <circle cx="24" cy="22" r="6" fill="#ef4444" />
  <circle cx="44" cy="22" r="6" fill="#f59e0b" />
  <circle cx="64" cy="22" r="6" fill="#10b981" />

  <!-- Terminal Title & Status -->
  <text x="410" y="26" text-anchor="middle" class="term-title">adeesha@agentic-core: ~/ai-workspace</text>
  
  <g transform="translate(710, 22)">
    <circle cx="0" cy="0" r="4.5" class="status-dot"/>
    <text x="10" y="4" font-family="sans-serif" font-size="11" fill="#34d399" font-weight="600">ONLINE</text>
  </g>

  <!-- Terminal Body Content -->
  <g transform="translate(28, 72)" class="term-code">
    <!-- Line 1: Init command -->
    <text x="0" y="0">
      <tspan class="prompt">adeesha@core:~$</tspan>
      <tspan class="cmd"> initialize-pipeline --target "Agentic-RAG-v3.8"</tspan>
    </text>

    <!-- Line 2: Pipeline status -->
    <text x="0" y="24">
      <tspan class="log-ok">[✓]</tspan>
      <tspan class="log-txt"> Vector Index: ChromaDB / Supabase pgvector connected </tspan>
      <tspan fill="#64748b">(latency: 12ms)</tspan>
    </text>

    <!-- Line 3: Multi-agent reasoning -->
    <text x="0" y="46">
      <tspan class="log-ok">[✓]</tspan>
      <tspan class="log-txt"> Core Architecture: Multi-Agent Reasoning &amp; Explainable ML Active</tspan>
    </text>

    <!-- Line 4: Query -->
    <text x="0" y="80">
      <tspan class="prompt">adeesha@core:~$</tspan>
      <tspan class="cmd"> query-profile --user "Adeesha Chathurmina" --format json</tspan>
    </text>

    <!-- Structured JSON Response -->
    <text x="0" y="110" fill="#cbd5e1">{</text>
    <text x="20" y="132">
      <tspan class="json-key">"role":</tspan> <tspan class="json-str">"Full-Stack AI &amp; Data Science Engineer"</tspan><tspan fill="#cbd5e1">,</tspan>
    </text>
    <text x="20" y="154">
      <tspan class="json-key">"domains":</tspan> <tspan fill="#cbd5e1">[</tspan><tspan class="json-arr">"Generative AI"</tspan><tspan fill="#cbd5e1">, </tspan><tspan class="json-arr">"Agentic RAG"</tspan><tspan fill="#cbd5e1">, </tspan><tspan class="json-arr">"Machine Learning"</tspan><tspan fill="#cbd5e1">, </tspan><tspan class="json-arr">"UI/UX Design"</tspan><tspan fill="#cbd5e1">],</tspan>
    </text>
    <text x="20" y="176">
      <tspan class="json-key">"core_philosophy":</tspan> <tspan class="json-str">"Bridging intelligent algorithms with human-centric software"</tspan><tspan fill="#cbd5e1">,</tspan>
    </text>
    <text x="20" y="198">
      <tspan class="json-key">"live_projects":</tspan> <tspan fill="#cbd5e1">[</tspan><tspan class="json-arr">"luxcar-intelligence-360"</tspan><tspan fill="#cbd5e1">, </tspan><tspan class="json-arr">"studypilot-ai"</tspan><tspan fill="#cbd5e1">, </tspan><tspan class="json-arr">"CeylonPath-R"</tspan><tspan fill="#cbd5e1">],</tspan>
    </text>
    <text x="20" y="220">
      <tspan class="json-key">"collaboration_status":</tspan> <tspan class="json-ok" fill="#34d399">"Open for High-Impact AI Projects &amp; Research 🚀"</tspan>
    </text>
    <text x="0" y="242" fill="#cbd5e1">}</text>

    <!-- Line 5: Next prompt with blinking cursor -->
    <text x="0" y="278">
      <tspan class="prompt">adeesha@core:~$</tspan>
      <tspan class="cmd"> build-the-future</tspan>
      <tspan class="cursor"> █</tspan>
    </text>
  </g>
</svg>
